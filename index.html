<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ember</title>

    <!-- Theme & Color -->
    <meta name="theme-color" content="#0B0B10" />
    <meta name="description" content="A private, mindful, local-first space for intentional motivation and personal content." />

    <!-- Open Graph / Facebook / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ember — Mindful, Local-First Motivation" />
    <meta property="og:description" content="A calm, private web app to curate your personal algorithm of quotes, photos, and hype videos with zero network tracking." />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ember — Mindful, Local-First Motivation" />
    <meta name="twitter:description" content="A calm, private web app to curate your personal algorithm of quotes, photos, and hype videos with zero network tracking." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />

    <!-- Structured Data (JSON-LD) for SEO / AEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ember",
        "description": "A mindful, local-first Progressive Web App to curate your own personal algorithm of grounding quotes, photos, and hype videos with zero algorithms and zero tracking.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Immediate Theme Hydration (Prevents flash of dark/light theme on initial load) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ember_theme') || 'dark';
          var eff = t;
          if (t === 'system') {
            eff = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', eff);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', eff === 'light' ? '#FAF8F5' : '#0B0B10');
        } catch (e) {}
      })();
    </script>

    <!-- Mobile Web App Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ember" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
